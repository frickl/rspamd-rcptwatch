outbound_guard {
    enabled = true;
    window = 21600;                 # 6 hours INACTIVITY, not exact sliding window
    max_recipients = 50;            # alert when active relationships > 50
    alert_cooldown = 21600;         # at most one alert per user per cooldown
    key_prefix = "outguard:v1:";
    script_path = "/etc/rspamd/local.d/outbound_guard_record.lua";
    # By default, lua_redis attempts to use Rspamd's shared Redis settings.
    # servers = "127.0.0.1:6379";
}

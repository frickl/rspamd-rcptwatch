# MERGE these blocks into existing metadata_exporter configuration.
# Do NOT replace custom_select/rules from unrelated integrations.
# This is independent from spamprobe and any other exporter rule.
custom_select {
    outguard_alert = <<EOD
return function(task)
  return task:has_symbol('OUTGUARD_ALERT')
end
EOD;
}

rules {
    outguard_smtp {
        backend = send_mail;
        selector = outguard_alert;
        smtp = "127.0.0.1";       # set a reachable, permitted SMTP relay
        mail_to = "postmaster@example.org";
        mail_from = "outguard@example.org";
        formatter = email_alert;
        email_template = <<EOD
From: Outbound Guard <$mail_from>
To: $mail_to
Subject: [OUTGUARD] Recipient limit exceeded
Date: $date
MIME-Version: 1.0
Content-Type: text/plain; charset=utf-8

Outbound recipient limit exceeded.

Authenticated user: $user
Queue ID: $qid
SMTP sender: $from
SMTP recipients: $rcpt

Rspamd symbols:
$symbols
EOD;
    }
}

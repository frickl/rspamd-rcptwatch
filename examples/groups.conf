# Merge this into your existing local groups.conf; do not overwrite existing rules.
group "outbound_guard" {
  symbol "OUTGUARD_OBSERVE" { weight = 0.0; description = "Outbound recipient diversity observed"; }
  symbol "OUTGUARD_ALERT" { weight = 0.0; description = "Outbound recipient threshold exceeded"; }
  symbol "OUTGUARD_REDIS_ERROR" { weight = 0.0; description = "Outbound Guard Redis operation failed"; }
}
